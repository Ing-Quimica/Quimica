<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rutas Intercampus · Ingeniería Química UNAL Medellín</title>
  <meta name="description" content="Horarios oficiales de buses intercampus (Robledo, El Volador y Río) y rutas a estaciones del Metro (Hospital, Suramericana y Caribe) para estudiantes de Ingeniería Química y de la UNAL Sede Medellín.">
  <link rel="icon" type="image/png" href="img/logo-quimica.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Grotesk:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/intercampus.css">
</head>
<body data-pagina="intercampus">

  <div id="barra"></div>

  <!-- PORTADA -->
  <section class="portada portada--corta foto foto--panoramica">
    <div class="contenedor portada__contenido">
      <div class="portada__logo-wrap">
        <img class="portada__logo" src="img/logo-quimica.png" alt="Logo de Ingeniería Química · Facultad de Minas" width="120" height="120">
      </div>
      <p class="portada__lugar">Movilidad Universitaria · UNAL Sede Medellín</p>
      <h1 class="portada__titulo">
        <span class="portada__antetitulo">Transporte y Conexión de Campus</span>
        <span class="letras-varsity">Rutas</span>
        <span class="letras-varsity letras-varsity--sub">Intercampus</span>
      </h1>
      <p class="portada__texto">Horarios oficiales de los buses universitarios entre Campus Robledo, El Volador y Río, y rutas de enlace a estaciones del Metro (Hospital, Suramericana y Caribe).</p>
    </div>
  </section>

  <main>
    <section class="seccion intercampus" aria-label="Rutas y horarios intercampus">
      <div class="contenedor">

        <!-- SELECTOR DE RUTA (TABS) -->
        <ul class="intercampus__tabs" id="intercampus-tabs" aria-label="Selector de ruta intercampus"></ul>

        <!-- CONTENIDO DINÁMICO DE LA RUTA -->
        <div id="intercampus-contenido">
          <p class="cargando">Cargando horarios intercampus…</p>
        </div>

      </div>
    </section>
  </main>

  <!-- MODAL PARA AMPLIAR LÁMINAS OFICIALES -->
  <dialog class="inter-modal" id="inter-modal" aria-label="Vista ampliada de la lámina oficial de la ruta">
    <div class="inter-modal__caja">
      <button class="inter-modal__cerrar" id="inter-modal-cerrar" type="button" aria-label="Cerrar vista ampliada">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="inter-modal__img-wrap">
        <img id="inter-modal-img" src="" alt="Lámina oficial ampliada de la ruta intercampus">
      </div>
      <p id="inter-modal-pie" class="inter-modal__pie"></p>
    </div>
  </dialog>

  <div id="pie"></div>

  <script src="js/comun.js"></script>
  <script src="js/intercampus.js"></script>
</body>
</html>
